<!DOCTYPE html>
<html>
<head>
    <title>Hovers, Transitions, Shadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="activity 3 css.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(ellipse at bottom right, #3d0030 0%, #1a0010 50%, #0d0008 100%);
            min-height: 100vh;
            padding: 60px 40px;
            color: white;
        }
        .page-title {
            font-size: 11px; letter-spacing: 4px; font-weight: 700;
            text-transform: uppercase; margin-bottom: 36px;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
            background-size: 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer { 0% { background-position: 0% } 100% { background-position: 200% } }
        .btn-grid { display: flex; flex-wrap: wrap; gap: 14px; }
    </style>
</head>
<body>
    <p class="page-title">#3 — Hover, Shadow & Transition</p>
    <div class="btn-grid">
        <button class="uberbutton">Request now</button>
        <button class="amazonbutton">Add to cart</button>
        <button class="githubbutton">Sign up</button>
        <button class="bootstrapbutton">Get started</button>
        <button class="bootstrap2button">Download</button>
        <button class="linkedinbutton">Apply on company website</button>
        <button class="linkedin2button">Save</button>
    </div>
</body>
</html>

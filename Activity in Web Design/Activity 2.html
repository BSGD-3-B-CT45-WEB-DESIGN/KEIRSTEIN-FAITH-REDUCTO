<!DOCTYPE html>
<html>
<head>
    <title>BUTTON ACTIVITY 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(ellipse at top left, #3d0030 0%, #1a0010 50%, #0d0008 100%);
            min-height: 100vh;
            padding: 60px 40px;
            color: white;
        }
        .page-title {
            font-size: 11px; letter-spacing: 4px; font-weight: 700;
            text-transform: uppercase; margin-bottom: 36px;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
            background-size: 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer { 0% { background-position: 0% } 100% { background-position: 200% } }
        .btn-grid { display: flex; flex-wrap: wrap; gap: 14px; }

        .uberbutton {
            background-color: #000000; border: none; color: white;
            padding: 15px 32px; font-size: 16px; margin: 4px 2px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .amazonbutton {
            background-color: rgb(255, 216, 20); border: none; color: rgb(0, 0, 0);
            padding: 15px 32px; font-size: 16px; width: 200px;
            margin: 4px 2px; border-radius: 49px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .githubbutton {
            background-color: rgb(46, 164, 79); border: none; color: white;
            padding: 15px 32px; font-size: 16px; margin: 4px 2px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .bootstrapbutton {
            background-color: rgb(121, 82, 179); border: none; color: rgb(255, 255, 255);
            padding: 15px 32px; font-size: 16px; font-weight: bold;
            margin: 4px 2px; border-radius: 8px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .bootstrap2button {
            background-color: rgb(255, 255, 255); border: 1px solid rgb(108, 117, 125);
            color: rgb(108, 117, 125); padding: 15px 32px; font-size: 16px;
            font-weight: bold; margin: 4px 2px; border-radius: 8px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .linkedinbutton {
            background-color: rgb(10, 102, 194); border: none; color: white;
            padding: 15px 32px; font-size: 16px; font-weight: bold;
            margin: 4px 2px; border-radius: 49px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .linkedin2button {
            background-color: rgb(255, 255, 255); border: 1px solid rgb(10, 102, 194);
            color: rgb(10, 102, 194); padding: 15px 32px; font-size: 16px;
            font-weight: bold; margin: 4px 2px; border-radius: 49px; cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <p class="page-title">#2 — CSS Basic Buttons</p>
    <div class="btn-grid">
        <button class="uberbutton">Request now</button>
        <button class="amazonbutton">Add to cart</button>
        <button class="githubbutton">Sign up</button>
        <button class="bootstrapbutton">Get started</button>
        <button class="bootstrap2button">Download</button>
        <button class="linkedinbutton">Apply on company website</button>
        <button class="linkedin2button">Save</button>
    </div>
</body>
</html>
